[workspace]
resolver = "2"
members = [
    "crates/llama-rs",
    "crates/qtensor",
    "crates/llamarust-core",
    "crates/llamarust-cli",
    "crates/llamarust-server",
    "crates/llamarust-qt",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Mitchell <mitchell@localhost>"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
colored = "3.1"
futures-util = "0.3"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
