[workspace]
resolver = "2"
members = [
    "crates/mrml-model",
    "crates/mrml-tensor",
    "crates/mrml-core",
    "crates/mrml-cli",
    "crates/mrml-machine",
    "crates/mrml-anyhow",
    "crates/mrml-server",
    "crates/mrml-terminal-style",
    "crates/mrml-tools",
    "crates/mrml-urlencoding",
    "crates/mrml-windows",
    "crates/mrml-linux",
    "crates/mrml-json",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Mitchell Renouf <mitchell@localhost>"]
license = "CC0-1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
