[workspace]
resolver = "2"
members = [
    "crates/mrml-model",
    "crates/mrml-tensor",
    "crates/mrml-core",
    "crates/mrml-cli",
    "crates/mrml-machine",
    "crates/mrml-anyhow",
    "crates/mrml-server",
    "crates/mrml-terminal-style",
    "crates/mrml-tools",
    "crates/mrml-urlencoding",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Mitchell Renouf <mitchell@localhost>"]
license = "CC0-1.0"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
