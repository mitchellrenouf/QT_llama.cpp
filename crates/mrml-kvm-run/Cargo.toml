[package]
name = "mrml-kvm-run"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Verified standalone MRML kernel launcher for KVM"

[[bin]]
name = "mrml-kvm-run"
path = "src/main.rs"

[dependencies]
mrml-crypto = { path = "../mrml-crypto", default-features = false }
mrml-error = { path = "../mrml-error" }
mrml-kernel = { path = "../mrml-kernel" }
mrml-kvm = { path = "../mrml-kvm" }
mrml-runtime = { path = "../mrml-runtime" }
