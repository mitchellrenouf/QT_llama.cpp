[package]
name = "mrml-model"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MRML model and chat adapter for native in-process GGUF inference"

[dependencies]
serde_json = { package = "mrml-json", path = "../mrml-json", default-features = false, optional = true }
mrml-tensor = { path = "../mrml-tensor", default-features = false, optional = true }
mrml-runtime = { path = "../mrml-runtime" }

[features]
default = ["runtime"]
runtime = ["dep:serde_json", "dep:mrml-tensor", "mrml-tensor/runtime"]
std = ["runtime", "mrml-tensor/std"]
auto = ["std", "mrml-tensor/cuda"]
cuda = ["std", "mrml-tensor/cuda"]
vulkan = ["std"]
hipblas = ["std"]
sycl = ["std"]
