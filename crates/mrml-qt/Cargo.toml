[package]
name = "mrml-qt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
build = "build.rs"
autobins = false

[features]
default = ["auto"]
auto = ["mrml-core/auto"]
cuda = ["mrml-core/cuda"]
vulkan = ["mrml-core/vulkan"]

[dependencies]
mrml-core = { path = "../mrml-core", default-features = false }
anyhow.workspace = true
clap.workspace = true
colored.workspace = true
futures-util.workspace = true
serde_json.workspace = true
tokio.workspace = true
qtrs = "0.5.7"
tokio-tungstenite = "0.26"
tungstenite = "0.26"

[[bin]]
name = "mrml-qt"
path = "src/main.rs"
