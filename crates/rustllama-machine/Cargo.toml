[package]
name = "rustllama-machine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "rustllama-machine"
path = "src/main.rs"

[features]
default = ["auto"]
auto = ["rustllama-core/auto"]
cuda = ["rustllama-core/cuda"]
vulkan = ["rustllama-core/vulkan"]
hipblas = ["rustllama-core/hipblas"]
sycl = ["rustllama-core/sycl"]

[dependencies]
rustllama-core = { path = "../rustllama-core", default-features = false }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
