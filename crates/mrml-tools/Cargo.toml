[package]
name = "mrml-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
mrml-terminal-style = { path = "../mrml-terminal-style" }
anyhow = { package = "mrml-anyhow", path = "../mrml-anyhow" }
serde_json = { package = "mrml-json", path = "../mrml-json" }
