urlencoding = { package = "mrml-urlencoding", path = "../mrml-urlencoding" }

[target.'cfg(windows)'.dependencies]
mrml-windows = { path = "../mrml-windows" }

[target.'cfg(unix)'.dependencies]
mrml-linux = { path = "../mrml-linux" }
