[package]
name = "mrml-tensor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MRML Tensor: quantized tensor math, GGUF execution, and CUDA acceleration"

[features]
default = ["runtime"]
runtime = []
cuda = ["runtime"]

[dependencies]
mrml-math = { path = "../mrml-math" }
mrml-runtime = { path = "../mrml-runtime" }

[build-dependencies]
mrml-runtime = { path = "../mrml-runtime" }

[target.'cfg(windows)'.dependencies]
mrml-windows = { path = "../mrml-windows" }

[target.'cfg(unix)'.dependencies]
mrml-linux = { path = "../mrml-linux" }

[[bench]]
name = "hot_paths"
harness = false
