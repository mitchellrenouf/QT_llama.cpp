[package]
name = "llama-rs"
version = "0.1.0"
edition = "2021"
authors = ["Mitchell <mitchell@localhost>"]
description = "High-performance safe Rust GGML runtime for in-process LLM inference"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "rt"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
qtensor = { path = "../qtensor" }

[features]
default = ["auto"]
auto = []
cuda = []
vulkan = []
hipblas = []
sycl = []

[build-dependencies]
cmake = "0.1"
cc = "1.0"
walkdir = "2.5"
