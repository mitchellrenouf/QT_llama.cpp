[package]
name = "mrml-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["auto"]
auto = ["mrml-model/auto"]
cuda = ["mrml-model/cuda"]
vulkan = ["mrml-model/vulkan"]
hipblas = ["mrml-model/hipblas"]
sycl = ["mrml-model/sycl"]

[dependencies]
mrml-model = { path = "../mrml-model" }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
colored.workspace = true
futures-util.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
urlencoding = "2.1"
similar = "3.1"
scraper = "0.27"
termimad = "0.35"
chromiumoxide = { version = "0.9.1", features = ["fetcher", "rustls", "zip8"] }
tokio-tungstenite = "0.26"
