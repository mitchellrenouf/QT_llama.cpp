[package]
name = "qtensor"
version = "0.1.0"
edition = "2021"
authors = ["Mitchell <mitchell@localhost>"]
description = "QTensor: High-performance pure Rust tensor compute engine with quantized math (Q4_0, Q8_0), GGUF parsing, and CUDA GPU acceleration"

[features]
default = ["cuda"]
cuda = []

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "rt"] }
dirs = "6.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
rayon = "1.10"
memmap2 = "0.9"

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
