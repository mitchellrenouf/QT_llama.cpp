name: Flatpak Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  main-app:
    name: "Main App Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Free Runner Disk Space
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          df -h

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust & Vendor Dependencies
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          . "$HOME/.cargo/env"
          cargo vendor

      - name: Validate AppStream Metadata
        run: |
          if command -v appstreamcli >/dev/null 2>&1; then
            appstreamcli validate --no-net flatpak/dev.mitchellrenouf.QT_llama.metainfo.xml || true
          elif command -v appstream-util >/dev/null 2>&1; then
            appstream-util validate-relax flatpak/dev.mitchellrenouf.QT_llama.metainfo.xml || true
          else
            echo "AppStream validator not available, skipping."
          fi

      - name: Lint Flatpak Manifest
        run: |
          if command -v flatpak-builder-lint >/dev/null 2>&1; then
            flatpak-builder-lint manifest flatpak/dev.mitchellrenouf.QT_llama.yml || true
          fi

      - name: Build Main Flatpak Package
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dev.mitchellrenouf.QT_llama.flatpak
          manifest-path: flatpak/dev.mitchellrenouf.QT_llama.yml
          run-tests: false

      - name: Upload Main Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QT_llama-flatpak-x86_64
          path: dev.mitchellrenouf.QT_llama.flatpak

      - name: Publish Release Bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dev.mitchellrenouf.QT_llama.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
