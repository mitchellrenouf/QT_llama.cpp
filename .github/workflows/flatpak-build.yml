name: Flatpak Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  flatpak:
    name: "Flatpak Builder (Freedesktop SDK 26.08 Beta)"
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate AppStream Metadata
        run: |
          appstream-util validate-relax flatpak/org.gemma.GemmaAgent.metainfo.xml

      - name: Build Flatpak Package
        uses: flatpak/flatpak-github-actions/flatpak-builder@v1
        with:
          bundle: org.gemma.GemmaAgent.flatpak
          manifest-path: flatpak/org.gemma.GemmaAgent.yml
          run-tests: true
          stop-at: gemma-agent

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: org.gemma.GemmaAgent.flatpak
          path: org.gemma.GemmaAgent.flatpak

      - name: Publish Release Bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: org.gemma.GemmaAgent.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
