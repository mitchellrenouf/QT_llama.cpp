name: Flatpak Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  flatpak:
    name: "Flatpak Builder"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate AppStream Metadata
        run: |
          if command -v appstreamcli >/dev/null 2>&1; then
            appstreamcli validate --no-net flatpak/org.gemma.GemmaAgent.metainfo.xml || true
          elif command -v appstream-util >/dev/null 2>&1; then
            appstream-util validate-relax flatpak/org.gemma.GemmaAgent.metainfo.xml || true
          else
            echo "AppStream validation tool not found in container, skipping."
          fi

      - name: Build Flatpak Package
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.gemma.GemmaAgent.flatpak
          manifest-path: flatpak/org.gemma.GemmaAgent.yml
          run-tests: false
          stop-at: gemma-agent

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: org.gemma.GemmaAgent.flatpak
          path: org.gemma.GemmaAgent.flatpak

      - name: Publish Release Bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: org.gemma.GemmaAgent.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
