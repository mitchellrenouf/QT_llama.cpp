name: Flatpak Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  main-app:
    name: "Flatpak Builder"
    runs-on: ubuntu-latest

    steps:
      - name: Free Runner Host Disk Space
        run: |
          echo "Freeing disk space on runner host..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          df -h

      - name: Install Flatpak & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb appstream-util
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11 org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust & Vendor Dependencies
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          . "$HOME/.cargo/env"
          cargo vendor

      - name: Validate AppStream Metadata
        run: |
          if command -v appstreamcli >/dev/null 2>&1; then
            appstreamcli validate --no-net flatpak/dev.mitchellrenouf.QT_llama.metainfo.xml || true
          elif command -v appstream-util >/dev/null 2>&1; then
            appstream-util validate-relax flatpak/dev.mitchellrenouf.QT_llama.metainfo.xml || true
          else
            echo "AppStream validator not available, skipping."
          fi

      - name: Lint Flatpak Manifest
        run: |
          if command -v flatpak-builder-lint >/dev/null 2>&1; then
            flatpak-builder-lint manifest flatpak/dev.mitchellrenouf.QT_llama.yml || true
          fi

      - name: Build Flatpak Package
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dev.mitchellrenouf.QT_llama.flatpak
          manifest-path: flatpak/dev.mitchellrenouf.QT_llama.yml
          run-tests: false

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QT_llama-flatpak-x86_64
          path: dev.mitchellrenouf.QT_llama.flatpak

      - name: Publish Release Bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dev.mitchellrenouf.QT_llama.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    name: "Windows MSVC Builder"
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install CUDA 13.3.1
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'cuda_13.3.1_windows.exe'
          Invoke-WebRequest `
            -Uri 'https://developer.download.nvidia.com/compute/cuda/13.3.1/local_installers/cuda_13.3.1_windows.exe' `
            -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '-s' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "CUDA installer exited with code $($process.ExitCode)"
          }
          $cudaPath = 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3'
          if (-not (Test-Path (Join-Path $cudaPath 'bin\nvcc.exe'))) {
            throw "CUDA nvcc was not installed at $cudaPath"
          }
          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Release Binary
        shell: pwsh
        run: cargo build --release --locked --no-default-features --features cuda

      - name: Run Release Tests
        shell: pwsh
        run: cargo test --workspace --release --locked --no-default-features --features cuda

      - name: Bundle Qt Runtime
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD 'dist\QT_llama-windows-x86_64'
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -LiteralPath 'target\release\rustllama.exe' -Destination $packageDir
          & windeployqt.exe --release --no-translations --no-system-d3d-compiler `
            (Join-Path $packageDir 'rustllama.exe')

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QT_llama-windows-x86_64
          path: dist/QT_llama-windows-x86_64
