app-id: dev.mitchellrenouf.QT_llama
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rustllama

add-extensions:
  dev.mitchellrenouf.QT_llama.Extension.cuda:
    directory: extensions/cuda
    version: '6.11'
    add-ld-path: lib64:lib
    no-autodownload: true

  dev.mitchellrenouf.QT_llama.Extension.rocm:
    directory: extensions/rocm
    version: '6.11'
    add-ld-path: lib:lib64
    no-autodownload: true

  dev.mitchellrenouf.QT_llama.Extension.oneapi:
    directory: extensions/oneapi
    version: '6.11'
    add-ld-path: compiler/latest/lib:lib
    no-autodownload: true

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=dri
  - --device=all
  - --filesystem=host
  - --filesystem=xdg-config/qt_llama:create
  - --filesystem=xdg-cache/qt_llama:create
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /app/bin:/usr/lib/sdk/qt6/bin:/usr/lib/qt6/bin:/usr/lib/sdk/rust-stable/bin:/app/cuda/bin
  append-ld-library-path: /app/cuda/lib64:/app/lib
  env:
    CARGO_HOME: /run/build/qt-llama/cargo
    CUDA_PATH: /app/cuda
    CUDA_TOOLKIT_ROOT_DIR: /app/cuda
    LLAMA_CUDA: "1"
    LLAMA_VULKAN: "1"

modules:
  # 1. NVIDIA CUDA 13.3 Toolkit (Install via /var/tmp to prevent tmpfs exhaustion)
  - name: cuda-toolkit
    buildsystem: simple
    build-commands:
      - mkdir -p /var/tmp/cuda_tmp
      - TMPDIR=/var/tmp/cuda_tmp sh cuda_13.3.1_610.43.02_linux.run --silent --toolkit --toolkitpath=/app/cuda --tmpdir=/var/tmp/cuda_tmp --override --no-man-page
      - rm -rf /var/tmp/cuda_tmp
      # Strip unneeded samples, documentation, and graphical tools to optimize image footprint
      - rm -rf /app/cuda/doc /app/cuda/samples /app/cuda/extras /app/cuda/nsight* /app/cuda/nvvp*
      - mkdir -p /app/lib
      - cp -P /app/cuda/lib64/libcudart.so* /app/lib/ || true
      - cp -P /app/cuda/lib64/libcublas.so* /app/lib/ || true
      - cp -P /app/cuda/lib64/libcublasLt.so* /app/lib/ || true
    sources:
      - type: file
        url: https://developer.download.nvidia.com/compute/cuda/13.3.1/local_installers/cuda_13.3.1_610.43.02_linux.run
        sha256: 9f98ec1f6c950401041d3f1308e221f0d5db8771a8e10569001b64caaee31a92

  # 2. SPIRV-Headers required for ggml-vulkan shader compilation
  - name: spirv-headers
    buildsystem: cmake-ninja
    config-opts:
      - -DSPIRV_HEADERS_ENABLE_TESTS=OFF
      - -DSPIRV_HEADERS_ENABLE_INSTALL=ON
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-1.4.321.0.tar.gz
        sha256: 5bbea925663d4cd2bab23efad53874f2718248a73dcaf9dd21dff8cb48e602fc

  # 3. Main QT_llama application (Built with CUDA & Vulkan GPU acceleration)
  - name: qt-llama
    buildsystem: simple
    build-commands:
      # Setup offline vendored cargo configuration
      - mkdir -p ${CARGO_HOME}
      - mkdir -p .cargo
      # qtrs 0.5.7 stops searching when qmake6 is absent, even when the KDE
      # SDK provides Qt's qmake under another standard name/location.
      - |
        if ! command -v qmake6 >/dev/null 2>&1; then
          QMAKE_BIN="$(command -v qmake 2>/dev/null || command -v qmake-qt6 2>/dev/null || true)"
          for candidate in \
            /usr/bin/qmake6 \
            /usr/bin/qmake \
            /usr/bin/qmake-qt6 \
            /usr/lib/qt6/bin/qmake \
            /usr/lib/sdk/qt6/bin/qmake \
            /usr/lib/*/qt6/bin/qmake; do
            [ -n "$QMAKE_BIN" ] && break
            if [ -x "$candidate" ]; then
              QMAKE_BIN="$candidate"
              break
            fi
          done
          if [ -z "$QMAKE_BIN" ]; then
            QMAKE_BIN="$(find /usr -name qmake6 -o -name qmake -o -name qmake-qt6 2>/dev/null | head -n 1)"
          fi
          if [ -z "$QMAKE_BIN" ] || [ ! -x "$QMAKE_BIN" ]; then
            echo "Qt 6 qmake was not found in the KDE SDK" >&2
            find /usr -type f -name 'qmake*' -print 2>/dev/null || true
            exit 1
          fi
          ln -sf "$QMAKE_BIN" /app/bin/qmake6
        fi
        qmake6 -query QT_VERSION
      - |
        cat > .cargo/config.toml << 'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "vendor"
        EOF

      # Build release binary with full CUDA and Vulkan acceleration
      - cargo build --release --features cuda,vulkan --no-default-features

      # Install binaries & wrapper script
      - install -Dm755 target/release/rustllama /app/bin/rustllama
      - ln -sf /app/bin/rustllama /app/bin/qt-llama
      - install -Dm755 flatpak/qt-llama-wrapper.sh /app/bin/qt-llama-wrapper

      # Install AppStream metadata, desktop entry & application icon
      - install -Dm644 flatpak/dev.mitchellrenouf.QT_llama.desktop /app/share/applications/dev.mitchellrenouf.QT_llama.desktop
      - install -Dm644 flatpak/dev.mitchellrenouf.QT_llama.metainfo.xml /app/share/metainfo/dev.mitchellrenouf.QT_llama.metainfo.xml
      - install -Dm644 flatpak/icons/dev.mitchellrenouf.QT_llama.svg /app/share/icons/hicolor/scalable/apps/dev.mitchellrenouf.QT_llama.svg

      # Create extension mount point directories
      - mkdir -p /app/extensions/cuda /app/extensions/rocm /app/extensions/oneapi
    sources:
      - type: dir
        path: ..
