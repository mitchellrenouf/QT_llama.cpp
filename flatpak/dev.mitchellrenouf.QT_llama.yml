app-id: dev.mitchellrenouf.QT_llama
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: qt_llama

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=all
  - --filesystem=host
  - --filesystem=xdg-config/qt_llama:create
  - --filesystem=xdg-cache/qt_llama:create
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/qt-llama/cargo

modules:
  # Vulkan SDK 1.4.357 headers for ggml-vulkan backend
  - name: vulkan-headers
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v1.4.357.tar.gz
        sha256: 7dc0dbcf1d49dd3d7da3761c251c6097dfbaac475321a4a8a99269d3d5abecdc
    cleanup:
      - /share

  # Vulkan Loader 1.4.357 (libvulkan.so) for linking
  - name: vulkan-loader
    buildsystem: cmake-ninja
    config-opts:
      - -DVULKAN_HEADERS_INSTALL_DIR=/app
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/Vulkan-Loader/archive/refs/tags/v1.4.357.tar.gz
        sha256: 54fa49715782b919092c8353a8a7656180cad1a1b6879b61845e77c261edb2e7
    cleanup:
      - /lib/pkgconfig

  # Main application
  - name: qt-llama
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/qt-llama/cargo
    build-commands:
      # Set up vendored cargo sources for offline build
      - mkdir -p ${CARGO_HOME}
      - mkdir -p .cargo
      - |
        cat > .cargo/config.toml << 'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "vendor"
        EOF
      # Build with Vulkan GPU acceleration
      - cargo build --release --features vulkan --no-default-features
      - install -Dm755 target/release/qt_llama /app/bin/qt_llama
      - ln -sf /app/bin/qt_llama /app/bin/qt-llama
      - install -Dm644 flatpak/dev.mitchellrenouf.QT_llama.desktop /app/share/applications/dev.mitchellrenouf.QT_llama.desktop
      - install -Dm644 flatpak/dev.mitchellrenouf.QT_llama.metainfo.xml /app/share/metainfo/dev.mitchellrenouf.QT_llama.metainfo.xml
      - install -Dm644 flatpak/icons/dev.mitchellrenouf.QT_llama.svg /app/share/icons/hicolor/scalable/apps/dev.mitchellrenouf.QT_llama.svg
      - mkdir -p /app/share/qt_llama/qml
      - cp -r qml/* /app/share/qt_llama/qml/
    sources:
      - type: dir
        path: ..
