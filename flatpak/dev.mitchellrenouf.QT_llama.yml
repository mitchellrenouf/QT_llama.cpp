app-id: dev.mitchellrenouf.QT_llama
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: qt-llama-wrapper

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=dri
  - --device=all
  - --filesystem=host
  - --filesystem=xdg-config/qt_llama:create
  - --filesystem=xdg-cache/qt_llama:create
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/app/cuda/bin:/app/rocm/bin
  append-ld-library-path: /app/cuda/lib64:/app/rocm/lib:/app/rocm/lib64:/app/lib
  env:
    CARGO_HOME: /run/build/qt-llama/cargo
    CUDA_PATH: /app/cuda
    CUDA_TOOLKIT_ROOT_DIR: /app/cuda
    ROCM_PATH: /app/rocm
    HIP_PATH: /app/rocm
    LLAMA_CUDA: "1"
    LLAMA_HIPBLAS: "1"
    LLAMA_VULKAN: "1"

modules:
  # 1. NVIDIA CUDA 13.3 Toolkit (Local Runfile Installer)
  - name: cuda-toolkit
    buildsystem: simple
    build-commands:
      - sh cuda_13.3.1_610.43.02_linux.run --silent --toolkit --toolkitpath=/app/cuda --override --no-man-page
      # Strip unneeded samples, documentation, and graphical tools to optimize image footprint
      - rm -rf /app/cuda/doc /app/cuda/samples /app/cuda/extras /app/cuda/nsight* /app/cuda/nvvp*
      - mkdir -p /app/lib
      - cp -P /app/cuda/lib64/libcudart.so* /app/lib/ || true
      - cp -P /app/cuda/lib64/libcublas.so* /app/lib/ || true
      - cp -P /app/cuda/lib64/libcublasLt.so* /app/lib/ || true
    sources:
      - type: file
        url: https://developer.download.nvidia.com/compute/cuda/13.3.1/local_installers/cuda_13.3.1_610.43.02_linux.run
        sha256: 9f98ec1f6c950401041d3f1308e221f0d5db8771a8e10569001b64caaee31a92

  # 2. AMD ROCm 7.14 Toolkit (Local Runfile Installer for HIP / hipBLAS)
  - name: rocm-toolkit
    buildsystem: simple
    build-commands:
      - bash rocm-installer-7.14.0-7.run untar "/app/rocm"
      # Strip documentation, samples, and manual pages to optimize image footprint
      - rm -rf /app/rocm/doc /app/rocm/samples /app/rocm/share/doc /app/rocm/share/man
      - mkdir -p /app/lib
      - cp -P /app/rocm/lib/libamdhip64.so* /app/lib/ || true
      - cp -P /app/rocm/lib/libhipblas.so* /app/lib/ || true
      - cp -P /app/rocm/lib/libhipblaslt.so* /app/lib/ || true
      - cp -P /app/rocm/lib/libhsa-runtime64.so* /app/lib/ || true
      - cp -P /app/rocm/lib/librocm-core.so* /app/lib/ || true
    sources:
      - type: file
        url: https://repo.radeon.com/rocm/installer/rocm-runfile-installer/rocm-rel-7.14/rocm-installer-7.14.0-7.run
        sha256: 763887c73b744c66b74c4a95b7c4e4ae578153cce07e09234d97e0fd0e660fe8

  # 3. SPIRV-Headers required for ggml-vulkan shader compilation
  - name: spirv-headers
    buildsystem: cmake-ninja
    config-opts:
      - -DSPIRV_HEADERS_ENABLE_TESTS=OFF
      - -DSPIRV_HEADERS_ENABLE_INSTALL=ON
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-1.4.321.0.tar.gz
        sha256: 5bbea925663d4cd2bab23efad53874f2718248a73dcaf9dd21dff8cb48e602fc

  # 4. Main QT_llama application (Built with CUDA, ROCm hipBLAS, and Vulkan enabled)
  - name: qt-llama
    buildsystem: simple
    build-commands:
      # Setup offline vendored cargo configuration
      - mkdir -p ${CARGO_HOME}
      - mkdir -p .cargo
      - |
        cat > .cargo/config.toml << 'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "vendor"
        EOF

      # Build release binary with CUDA, ROCm/hipBLAS & Vulkan GPU acceleration
      - cargo build --release --features cuda,vulkan,hipblas --no-default-features

      # Install binaries & wrapper script
      - install -Dm755 target/release/qt_llama /app/bin/qt_llama
      - ln -sf /app/bin/qt_llama /app/bin/qt-llama
      - install -Dm755 flatpak/qt-llama-wrapper.sh /app/bin/qt-llama-wrapper

      # Install AppStream metadata, desktop entry & application icon
      - install -Dm644 flatpak/dev.mitchellrenouf.QT_llama.desktop /app/share/applications/dev.mitchellrenouf.QT_llama.desktop
      - install -Dm644 flatpak/dev.mitchellrenouf.QT_llama.metainfo.xml /app/share/metainfo/dev.mitchellrenouf.QT_llama.metainfo.xml
      - install -Dm644 flatpak/icons/dev.mitchellrenouf.QT_llama.svg /app/share/icons/hicolor/scalable/apps/dev.mitchellrenouf.QT_llama.svg

      # Install QML resources
      - mkdir -p /app/share/qt_llama/qml /app/share/gemma/qml
      - cp -r qml/* /app/share/qt_llama/qml/
      - cp -r qml/* /app/share/gemma/qml/
    sources:
      - type: dir
        path: ..
