app-id: dev.mitchellrenouf.QT_llama
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: qt-llama-wrapper

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=dri
  - --device=all
  - --filesystem=host
  - --filesystem=xdg-config/qt_llama:create
  - --filesystem=xdg-cache/qt_llama:create
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/qt-llama/cargo

modules:
  - name: qt-llama
    buildsystem: simple
    build-commands:
      # 1. Setup offline vendored cargo configuration
      - mkdir -p ${CARGO_HOME}
      - mkdir -p .cargo
      - |
        cat > .cargo/config.toml << 'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "vendor"
        EOF

      # 2. Build release binary with Vulkan GPU acceleration (built-in vulkan-stack in Freedesktop SDK 25.08)
      - cargo build --release --features vulkan --no-default-features

      # 3. Install binaries & wrapper script
      - install -Dm755 target/release/qt_llama /app/bin/qt_llama
      - ln -sf /app/bin/qt_llama /app/bin/qt-llama
      - install -Dm755 flatpak/qt-llama-wrapper.sh /app/bin/qt-llama-wrapper

      # 4. Install AppStream metadata, desktop entry & application icon
      - install -Dm644 flatpak/dev.mitchellrenouf.QT_llama.desktop /app/share/applications/dev.mitchellrenouf.QT_llama.desktop
      - install -Dm644 flatpak/dev.mitchellrenouf.QT_llama.metainfo.xml /app/share/metainfo/dev.mitchellrenouf.QT_llama.metainfo.xml
      - install -Dm644 flatpak/icons/dev.mitchellrenouf.QT_llama.svg /app/share/icons/hicolor/scalable/apps/dev.mitchellrenouf.QT_llama.svg

      # 5. Install QML resources
      - mkdir -p /app/share/qt_llama/qml /app/share/gemma/qml
      - cp -r qml/* /app/share/qt_llama/qml/
      - cp -r qml/* /app/share/gemma/qml/
    sources:
      - type: dir
        path: ..
