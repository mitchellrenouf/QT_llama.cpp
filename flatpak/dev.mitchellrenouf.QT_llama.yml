app-id: dev.mitchellrenouf.QT_llama
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: qt_llama

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=all
  - --filesystem=host
  - --filesystem=xdg-config/qt_llama:create
  - --filesystem=xdg-cache/qt_llama:create
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/qt-llama/cargo

modules:
  - name: qt-llama
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/qt-llama/cargo
    build-commands:
      # Set up vendored cargo sources for offline build
      - mkdir -p ${CARGO_HOME}
      - mkdir -p .cargo
      - |
        cat > .cargo/config.toml << 'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "vendor"
        EOF
      # Build with Vulkan GPU acceleration (headers+loader from Freedesktop SDK 25.08 vulkan-stack)
      - cargo build --release --features vulkan --no-default-features
      - install -Dm755 target/release/qt_llama /app/bin/qt_llama
      - ln -sf /app/bin/qt_llama /app/bin/qt-llama
      - install -Dm644 flatpak/dev.mitchellrenouf.QT_llama.desktop /app/share/applications/dev.mitchellrenouf.QT_llama.desktop
      - install -Dm644 flatpak/dev.mitchellrenouf.QT_llama.metainfo.xml /app/share/metainfo/dev.mitchellrenouf.QT_llama.metainfo.xml
      - install -Dm644 flatpak/icons/dev.mitchellrenouf.QT_llama.svg /app/share/icons/hicolor/scalable/apps/dev.mitchellrenouf.QT_llama.svg
      - mkdir -p /app/share/qt_llama/qml
      - cp -r qml/* /app/share/qt_llama/qml/
    sources:
      - type: dir
        path: ..
