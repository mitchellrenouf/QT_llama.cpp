app-id: dev.mitchellrenouf.QT_llama
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.cuda
  - org.freedesktop.Sdk.Extension.rocm
  - org.freedesktop.Sdk.Extension.oneapi
command: qt-llama-wrapper

add-extensions:
  dev.mitchellrenouf.QT_llama.Extension.cuda:
    directory: extensions/cuda
    version: '6.11'
    add-ld-path: lib64:lib
    no-autodownload: true

  dev.mitchellrenouf.QT_llama.Extension.rocm:
    directory: extensions/rocm
    version: '6.11'
    add-ld-path: lib:lib64
    no-autodownload: true

  dev.mitchellrenouf.QT_llama.Extension.oneapi:
    directory: extensions/oneapi
    version: '6.11'
    add-ld-path: compiler/latest/lib:lib
    no-autodownload: true

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=dri
  - --device=all
  - --filesystem=host
  - --filesystem=xdg-config/qt_llama:create
  - --filesystem=xdg-cache/qt_llama:create
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/cuda/bin:/usr/lib/sdk/rocm/bin:/usr/lib/sdk/oneapi/compiler/latest/bin
  append-ld-library-path: /usr/lib/sdk/cuda/lib64:/usr/lib/sdk/rocm/lib:/usr/lib/sdk/oneapi/compiler/latest/lib:/app/lib
  env:
    CARGO_HOME: /run/build/qt-llama/cargo
    CUDA_PATH: /usr/lib/sdk/cuda
    CUDA_TOOLKIT_ROOT_DIR: /usr/lib/sdk/cuda
    ROCM_PATH: /usr/lib/sdk/rocm
    HIP_PATH: /usr/lib/sdk/rocm
    ONEAPI_ROOT: /usr/lib/sdk/oneapi
    LLAMA_CUDA: "1"
    LLAMA_HIPBLAS: "1"
    LLAMA_SYCL: "1"
    LLAMA_VULKAN: "1"

modules:
  # 1. SPIRV-Headers required for ggml-vulkan shader compilation
  - name: spirv-headers
    buildsystem: cmake-ninja
    config-opts:
      - -DSPIRV_HEADERS_ENABLE_TESTS=OFF
      - -DSPIRV_HEADERS_ENABLE_INSTALL=ON
    sources:
      - type: archive
        url: https://github.com/KhronosGroup/SPIRV-Headers/archive/refs/tags/vulkan-sdk-1.4.321.0.tar.gz
        sha256: 5bbea925663d4cd2bab23efad53874f2718248a73dcaf9dd21dff8cb48e602fc

  # 2. Main QT_llama application (Compiled against CUDA, ROCm, oneAPI & Vulkan SDKs)
  - name: qt-llama
    buildsystem: simple
    build-commands:
      # Setup offline vendored cargo configuration
      - mkdir -p ${CARGO_HOME}
      - mkdir -p .cargo
      - |
        cat > .cargo/config.toml << 'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "vendor"
        EOF

      # Build release binary with full Multi-GPU acceleration
      - cargo build --release --features cuda,vulkan,hipblas,sycl --no-default-features

      # Install binaries & wrapper script
      - install -Dm755 target/release/qt_llama /app/bin/qt_llama
      - ln -sf /app/bin/qt_llama /app/bin/qt-llama
      - install -Dm755 flatpak/qt-llama-wrapper.sh /app/bin/qt-llama-wrapper

      # Install AppStream metadata, desktop entry & application icon
      - install -Dm644 flatpak/dev.mitchellrenouf.QT_llama.desktop /app/share/applications/dev.mitchellrenouf.QT_llama.desktop
      - install -Dm644 flatpak/dev.mitchellrenouf.QT_llama.metainfo.xml /app/share/metainfo/dev.mitchellrenouf.QT_llama.metainfo.xml
      - install -Dm644 flatpak/icons/dev.mitchellrenouf.QT_llama.svg /app/share/icons/hicolor/scalable/apps/dev.mitchellrenouf.QT_llama.svg

      # Install QML resources
      - mkdir -p /app/share/qt_llama/qml /app/share/gemma/qml
      - cp -r qml/* /app/share/qt_llama/qml/
      - cp -r qml/* /app/share/gemma/qml/

      # Create extension mount point directories
      - mkdir -p /app/extensions/cuda /app/extensions/rocm /app/extensions/oneapi
    sources:
      - type: dir
        path: ..
