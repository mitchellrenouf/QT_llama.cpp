<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="#4338ca" stroke-width="4" />

  <!-- Core Diamond Crystal Shape -->
  <g transform="translate(128, 128)" filter="url(#glow)">
    <polygon points="0,-72 62,-20 38,68 -38,68 -62,-20" fill="url(#gemGrad)" opacity="0.9" />
    <polygon points="0,-72 0,68 38,68 62,-20" fill="#ffffff" opacity="0.2" />
    <polygon points="0,-72 -62,-20 -18,10 0,-28" fill="#ffffff" opacity="0.3" />
    <circle cx="0" cy="0" r="16" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Orbiting Nodes -->
  <circle cx="64" cy="72" r="6" fill="#38bdf8" />
  <circle cx="192" cy="184" r="6" fill="#c084fc" />
  <circle cx="198" cy="80" r="4" fill="#818cf8" />
</svg>
