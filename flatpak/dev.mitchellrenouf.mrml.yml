app-id: dev.mitchellrenouf.mrml
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: mrml

add-extensions:
  dev.mitchellrenouf.mrml.Extension.cuda:
    directory: extensions/cuda
    version: '6.11'
    add-ld-path: lib64:lib
    no-autodownload: true

  dev.mitchellrenouf.mrml.Extension.rocm:
    directory: extensions/rocm
    version: '6.11'
    add-ld-path: lib:lib64
    no-autodownload: true

  dev.mitchellrenouf.mrml.Extension.oneapi:
    directory: extensions/oneapi
    version: '6.11'
    add-ld-path: compiler/latest/lib:lib
    no-autodownload: true

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --share=ipc
  - --device=dri
  - --device=all
  - --filesystem=host
  - --filesystem=xdg-config/mrml:create
  - --filesystem=xdg-cache/mrml:create
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /app/bin:/usr/lib/sdk/qt6/bin:/usr/lib/qt6/bin:/usr/lib/sdk/rust-stable/bin:/app/cuda/bin
  append-ld-library-path: /app/cuda/lib64:/app/lib
  env:
    CARGO_HOME: /run/build/mrml/cargo
    CUDA_PATH: /app/cuda
    CUDA_TOOLKIT_ROOT_DIR: /app/cuda
    MRML_CUDA: "1"

modules:
  # 1. NVIDIA CUDA 13.3 Toolkit (Install via /var/tmp to prevent tmpfs exhaustion)
  - name: cuda-toolkit
    buildsystem: simple
    build-commands:
      - mkdir -p /var/tmp/cuda_tmp
      - TMPDIR=/var/tmp/cuda_tmp sh cuda_13.3.1_610.43.02_linux.run --silent --toolkit --toolkitpath=/app/cuda --tmpdir=/var/tmp/cuda_tmp --override --no-man-page
      - rm -rf /var/tmp/cuda_tmp
      # Strip unneeded samples, documentation, and graphical tools to optimize image footprint
      - rm -rf /app/cuda/doc /app/cuda/samples /app/cuda/extras /app/cuda/nsight* /app/cuda/nvvp*
      - mkdir -p /app/lib
      # MRML Tensor's custom kernels use the CUDA Runtime API directly. cuBLAS is
      # not linked, so only libcudart needs to survive in the final package.
      - cp -P /app/cuda/lib64/libcudart.so* /app/lib/ || true
    sources:
      - type: file
        url: https://developer.download.nvidia.com/compute/cuda/13.3.1/local_installers/cuda_13.3.1_610.43.02_linux.run
        sha256: 9f98ec1f6c950401041d3f1308e221f0d5db8771a8e10569001b64caaee31a92

  # 2. Main MRML application (built with native CUDA acceleration)
  - name: mrml
    buildsystem: simple
    build-commands:
      # Setup offline vendored cargo configuration
      - mkdir -p ${CARGO_HOME}
      - mkdir -p .cargo
      # qtrs 0.5.7 stops searching when qmake6 is absent, even when the KDE
      # SDK provides Qt's qmake under another standard name/location.
      - |
        QMAKE_BIN="$(command -v qmake6 2>/dev/null || command -v qmake 2>/dev/null || command -v qmake-qt6 2>/dev/null || true)"
        if [ -z "$QMAKE_BIN" ]; then
          for candidate in \
            /usr/bin/qmake6 \
            /usr/bin/qmake \
            /usr/bin/qmake-qt6 \
            /usr/lib/qt6/bin/qmake \
            /usr/lib/sdk/qt6/bin/qmake \
            /usr/lib/*/qt6/bin/qmake; do
            [ -n "$QMAKE_BIN" ] && break
            if [ -x "$candidate" ]; then
              QMAKE_BIN="$candidate"
              break
            fi
          done
          if [ -z "$QMAKE_BIN" ]; then
            QMAKE_BIN="$(find /usr -name qmake6 -o -name qmake -o -name qmake-qt6 2>/dev/null | head -n 1)"
          fi
          if [ -z "$QMAKE_BIN" ] || [ ! -x "$QMAKE_BIN" ]; then
            echo "Qt 6 qmake was not found in the KDE SDK" >&2
            find /usr -type f -name 'qmake*' -print 2>/dev/null || true
            exit 1
          fi
        fi
        mkdir -p /app/bin
        ln -sf "$QMAKE_BIN" /app/bin/qmake6
        /app/bin/qmake6 -query QT_VERSION
      - |
        cat > .cargo/config.toml << 'EOF'
        [source.crates-io]
        replace-with = "vendored-sources"

        [source.vendored-sources]
        directory = "vendor"
        EOF

      # CUDA is explicit so the packaged Linux binary cannot silently become CPU-only.
      - cargo build -p mrml-qt --release --locked --no-default-features --features cuda

      # NVCC and the CUDA headers/static libraries are build-only. libcudart
      # was copied to /app/lib above; the host NVIDIA runtime provides libcuda.
      - rm -rf /app/cuda

      # Install binaries & wrapper script
      - install -Dm755 target/release/mrml-qt /app/bin/mrml
      - ln -sf /app/bin/mrml /app/bin/mrml-qt
      - install -Dm755 flatpak/mrml-wrapper.sh /app/bin/mrml-wrapper

      # Install AppStream metadata, desktop entry & application icon
      - install -Dm644 flatpak/dev.mitchellrenouf.mrml.desktop /app/share/applications/dev.mitchellrenouf.mrml.desktop
      - install -Dm644 flatpak/dev.mitchellrenouf.mrml.metainfo.xml /app/share/metainfo/dev.mitchellrenouf.mrml.metainfo.xml
      - install -Dm644 flatpak/icons/dev.mitchellrenouf.mrml.svg /app/share/icons/hicolor/scalable/apps/dev.mitchellrenouf.mrml.svg

      # Create extension mount point directories
      - mkdir -p /app/extensions/cuda /app/extensions/rocm /app/extensions/oneapi
    sources:
      - type: dir
        path: ..
