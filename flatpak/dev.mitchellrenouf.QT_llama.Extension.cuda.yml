id: dev.mitchellrenouf.QT_llama.Extension.cuda
branch: '6.11'
runtime: dev.mitchellrenouf.QT_llama
runtime-version: '6.11'
sdk: org.kde.Sdk
build-extension: true
appstream-compose: false

build-options:
  prefix: /app/extensions/cuda

modules:
  - name: cuda-toolkit
    buildsystem: simple
    build-commands:
      - sh cuda_13.3.1_610.43.02_linux.run --silent --toolkit --toolkitpath=/app/extensions/cuda --override --no-man-page
      # Remove unneeded documentation, samples, and large GUI debuggers
      - rm -rf /app/extensions/cuda/doc /app/extensions/cuda/samples /app/extensions/cuda/extras /app/extensions/cuda/nsight* /app/extensions/cuda/nvvp*
      - mkdir -p /app/extensions/cuda/lib
      - cp -P /app/extensions/cuda/lib64/libcudart.so* /app/extensions/cuda/lib/ || true
      - cp -P /app/extensions/cuda/lib64/libcublas.so* /app/extensions/cuda/lib/ || true
      - cp -P /app/extensions/cuda/lib64/libcublasLt.so* /app/extensions/cuda/lib/ || true
      # Create extension metadata
      - mkdir -p /app/extensions/cuda/share/metainfo
      - |
        cat > /app/extensions/cuda/share/metainfo/dev.mitchellrenouf.QT_llama.Extension.cuda.metainfo.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <component type="runtime">
          <id>dev.mitchellrenouf.QT_llama.Extension.cuda</id>
          <metadata_license>CC0-1.0</metadata_license>
          <name>NVIDIA CUDA 13.3 Acceleration Extension for QT_llama.cpp</name>
          <summary>Provides NVIDIA CUDA and cuBLAS GPU acceleration libraries for QT_llama.cpp</summary>
        </component>
        EOF
    sources:
      - type: file
        url: https://developer.download.nvidia.com/compute/cuda/13.3.1/local_installers/cuda_13.3.1_610.43.02_linux.run
        sha256: 9f98ec1f6c950401041d3f1308e221f0d5db8771a8e10569001b64caaee31a92
