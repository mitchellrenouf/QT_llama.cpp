id: dev.mitchellrenouf.QT_llama.Extension.rocm
branch: '6.11'
runtime: dev.mitchellrenouf.QT_llama
runtime-version: '6.11'
sdk: org.kde.Sdk
build-extension: true
appstream-compose: false

build-options:
  prefix: /app/extensions/rocm

modules:
  - name: rocm-toolkit
    buildsystem: simple
    build-commands:
      - bash rocm-installer-7.14.0-7.run untar "/app/extensions/rocm"
      - rm -rf /app/extensions/rocm/doc /app/extensions/rocm/samples /app/extensions/rocm/share/doc /app/extensions/rocm/share/man
      - mkdir -p /app/extensions/rocm/share/metainfo
      - |
        cat > /app/extensions/rocm/share/metainfo/dev.mitchellrenouf.QT_llama.Extension.rocm.metainfo.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <component type="runtime">
          <id>dev.mitchellrenouf.QT_llama.Extension.rocm</id>
          <metadata_license>CC0-1.0</metadata_license>
          <name>AMD ROCm 7.14 Acceleration Extension for QT_llama.cpp</name>
          <summary>Provides AMD ROCm and hipBLAS GPU acceleration libraries for QT_llama.cpp</summary>
        </component>
        EOF
    sources:
      - type: file
        url: https://repo.radeon.com/rocm/installer/rocm-runfile-installer/rocm-rel-7.14/rocm-installer-7.14.0-7.run
        sha256: 763887c73b744c66b74c4a95b7c4e4ae578153cce07e09234d97e0fd0e660fe8
