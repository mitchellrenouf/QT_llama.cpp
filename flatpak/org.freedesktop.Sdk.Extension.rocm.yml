id: org.freedesktop.Sdk.Extension.rocm
branch: '6.11'
runtime: org.kde.Sdk
runtime-version: '6.11'
sdk: org.kde.Sdk
build-extension: true
appstream-compose: false

build-options:
  prefix: /usr/lib/sdk/rocm

modules:
  - name: rocm-toolkit
    buildsystem: simple
    build-commands:
      - bash rocm-installer-7.14.0-7.run untar "/usr/lib/sdk/rocm"
      - rm -rf /usr/lib/sdk/rocm/doc /usr/lib/sdk/rocm/samples /usr/lib/sdk/rocm/share/doc /usr/lib/sdk/rocm/share/man
      - mkdir -p /usr/lib/sdk/rocm/share/metainfo
      - |
        cat > /usr/lib/sdk/rocm/share/metainfo/org.freedesktop.Sdk.Extension.rocm.metainfo.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <component type="runtime">
          <id>org.freedesktop.Sdk.Extension.rocm</id>
          <metadata_license>CC0-1.0</metadata_license>
          <name>AMD ROCm 7.14 SDK Extension</name>
          <summary>AMD ROCm and HIP Development SDK for Flatpak SDK</summary>
        </component>
        EOF
    sources:
      - type: file
        url: https://repo.radeon.com/rocm/installer/rocm-runfile-installer/rocm-rel-7.14/rocm-installer-7.14.0-7.run
        sha256: 763887c73b744c66b74c4a95b7c4e4ae578153cce07e09234d97e0fd0e660fe8
